server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes (e.g. /resources/3) have no file on disk:
  # fall back to index.html and let React Router handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built assets must exist: a missing file is a real 404, not the HTML shell.
  location /assets/ {
    try_files $uri =404;
  }
}
