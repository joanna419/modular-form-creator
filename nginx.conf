server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text assets (the JS bundle shrinks ~70%).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Client-side routes (e.g. /resources/3) have no file on disk:
  # fall back to index.html and let React Router handle them.
  location / {
    try_files $uri $uri/ /index.html;
    # The HTML shell must always be revalidated so a new deploy is picked up.
    add_header Cache-Control "no-cache";
  }

  # Built assets have content hashes in their names: cache them forever.
  # A missing file is a real 404, not the HTML shell.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
